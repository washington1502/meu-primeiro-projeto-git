<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@0,100..700;1,100..700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <title>Projeto Conversor De Moedas</title>
</head>

<body>
  <img class="logo" src="./assets/logo.gif" alt="Logo-do-Conversor">
  <main>
    <div class="form-container">
      <label>
        Converter <b>De</b>
        <select id="moeda-origem">
          <option>R$ Real Brasileiro</option>
        </select>
      </label>
      <label>
        Converter <b>Para</b>
        <select class = "currency-select">
          <option value="dolar">US$ Dólar Americano</option>
          <option value="euro">€ Euro</option>
        </select>
      </label>
      <label>
        Valor
        <input class="input-currency" placeholder="R$10.000,00" type="number">
      </label>
      <button class="convert-button">Converter</button>
    </div>
    <section class="conversion-section">
      <div class="currency-box">
        <img src="./assets/brasil 2.png" alt="Bandeira do Brasil">
        <p class="currency">Real</p>
        <R$ class="currency-value-to-convert">R$ 0,00</p>
      </div>
      <div class="arrow-seta">
        <img src="./assets/Vector@2x.png" alt="Seta para baixo">
      </div>
      <div class="currency-box">
        <img id="bandeira-destino" src="./assets/estados-unidos (1) 1.png" alt="Bandeira-Estados-Unidos">
        <p class="currency" id="currency-name">Dólar-americano </p>
        <p class="currency-value" id="valor-convertido">US$ 0,00</p>
      </div>
    </section>
  </main>
  

  <script src="./scripts.js"></script>
</body>

</html>
