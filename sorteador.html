<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dev-Sorteio</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <div class="logo">
            <img src="./assets/dado.png" alt="Dado" class="dice-img">
            <p>DevSorteio</p>

            <div class="sorteio-box">
                <h2>Sortear um número</h2>

                <div class="input-group">
                    <div class="input-wrapper">
                        <label>entre</label>
                        <input type="number" id="minNumber" value="1" min="0">
                    </div>

                    <span class="separator">e</span>

                    <div class="input-wrapper">
                        <label>e</label>
                        <input type="number" id="maxNumber" value="100" min="1">
                    </div>
                </div>

                <button class="btn-sortear" onclick="sortear()">Sortear</button>

                <div class="resultado" id="resultado"></div>
            </div>
        </div>

        <script src="script.js"></script>
</body>

</html>
